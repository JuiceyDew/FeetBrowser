name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
  # The one job that leaves the machine runs on a timer instead of on every
  # push; see `live-web` at the bottom.
  schedule:
    - cron: '23 5 * * 1'

# Pushing three times in a minute should leave one run, not three. Except on
# main, where every commit's run is the record of whether that commit was
# good, and cancelling it erases the answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# .venv/bin on unix, .venv/Scripts on Windows -- bash exists on all three
# runners, so $PY works everywhere and a step never has to know which.
defaults:
  run:
    shell: bash

jobs:
  # The whole offline suite, on every interpreter the engine claims to
  # support (rust/pyproject.toml says >=3.9) and on all three platforms that
  # have a window backend. macOS and Windows are here for one specific
  # reason each: cocoa.py and win32.py are window backends that Linux can
  # only ever prove skip cleanly.
  test:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.14' }
          - { os: macos-latest, python: '3.12' }
          - { os: macos-latest, python: '3.14' }
          - { os: windows-latest, python: '3.12' }
          - { os: windows-latest, python: '3.14' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          python-version: ${{ matrix.python }}

      - name: Lint (pyflakes)
        run: $PY -m pyflakes feetbrowser tests

      # The list of suites below is typed out twice, here and in test.sh, so
      # that a red job names the suite that went red. This is what stops the
      # two copies drifting: it fails if a file in tests/ is in neither.
      - name: Every suite is run by something
        run: $PY tests/test_suites.py

      - name: Renderer tests
        run: $PY tests/test_render.py

      - name: Discord Rich Presence tests
        run: $PY tests/test_discord.py

      # test_cocoa opens real NSWindows on the macOS runners and test_win32
      # opens real HWNDs on the Windows ones; each skips off its own
      # platform, and test_x11 and test_wayland run their whole offline half
      # everywhere. Until this matrix grew a Windows entry, the 31 tests in
      # test_win32.py had never been executed by anything.
      - name: Platform window tests
        run: |
          $PY tests/test_cocoa.py
          $PY tests/test_x11.py
          $PY tests/test_win32.py
          $PY tests/test_wayland.py

      # The browser's half of the audio seam: a <video> element that has a
      # soundtrack, and the pictures that have to follow it. The audio stack
      # itself -- ring, resampler, mixer, clock, backends -- is feetplayer's
      # now and is tested in that repository. One of these decodes real AAC
      # out of a real MP4 with the Fortran decoder, on all three runners, so
      # this is also where the installed feetplayer is proved to work.
      - name: Audio tests
        run: $PY tests/test_audio.py

      - name: Unit tests
        run: $PY tests/test_units.py

      # Small, and it runs on every platform for one reason: the release
      # workflow calls it on whichever runner picks up the version job, and
      # a guard that only works on Linux is not a guard.
      - name: The release version guard
        run: $PY tests/test_release_version.py

      # The engine answers to one contract, and the same suite holds it to it.
      - name: JS engine tests
        run: $PY tests/test_js.py

      - name: Shoes tests
        run: $PY tests/test_shoes.py

      - name: Settings tests
        run: $PY tests/test_settings.py

      - name: Toe engine tests
        run: $PY tests/test_toes.py

      # Linux/x86-64 assembles and runs the real kernels here; everywhere
      # else the module's pure-Python fallback is what gets checked.
      - name: Assembly X11 pixel-packing kernels
        run: $PY tests/test_asmx11.py
      - name: Assembly selection nearest-boundary kernel
        run: $PY tests/test_asmselect.py

      # The check this whole file was rebuilt for. A page with text, a PNG,
      # a GIF, a background and a border is fetched from a local server and
      # rendered, and then the pixels are counted: an image that stops
      # drawing takes a colour off the screen and this says which one.
      - name: End-to-end pixels
        run: $PY tests/test_e2e.py

      # Both of these have always needed the network, so CI never ran them
      # and the click-to-navigate path went unexercised. They point at an
      # offline mirror of the same two pages instead, over a real socket.
      - name: Navigation and history against the fixtures
        run: $PY tests/fixture_server.py tests/test_nav.py '{base}example.com/'

      - name: Whole-pipeline smoke against the fixtures
        run: |
          $PY tests/fixture_server.py tests/smoke.py \
            '{base}example.com/' '{base}iana.org/domains/example.html'

      # What a Windows user actually types, and the only thing here that
      # runs run.cmd at all. Everything above goes through $PY directly, so
      # without this the batch scripts could rot without a job noticing. The
      # venv already exists by now, which also makes this a check that the
      # script reuses one instead of rebuilding from scratch.
      - name: The Windows entry point runs
        if: runner.os == 'Windows'
        shell: cmd
        run: run.cmd --version

      # The other half of run.cmd: what it says when the toolchain is not
      # there. That is the first thing a new contributor on Windows meets --
      # rustup does not install the linker and Windows does not ship one, so
      # the build stops -- and nothing else here goes near the branch, because
      # this runner has both a linker and a built engine already. Copying the
      # script somewhere with no .venv and hiding cargo from PATH takes it on
      # purpose. It is also the only thing that checks the batch parses: an
      # unmatched label or a stray parenthesis in a block cmd.exe never
      # reaches would otherwise ship unnoticed.
      - name: The toolchain message says what to install
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\notoolchain"
          copy /y run.cmd "%RUNNER_TEMP%\notoolchain\" >nul
          set "PATH=%pythonLocation%;%SystemRoot%\System32"
          call "%RUNNER_TEMP%\notoolchain\run.cmd" > "%RUNNER_TEMP%\said.txt" 2>&1
          if not errorlevel 1 exit /b 1
          type "%RUNNER_TEMP%\said.txt"
          findstr /c:"Desktop development with C++" "%RUNNER_TEMP%\said.txt" >nul || exit /b 1
          findstr /c:"rustup.rs" "%RUNNER_TEMP%\said.txt" >nul || exit /b 1
          rem The GNU toolchain is the other answer people are given, and it
          rem fails at dlltool rather than at link.exe. Someone sent down that
          rem road by the paragraph above needs the rest of the story in the
          rem same message, so assert it is still in there.
          findstr /c:"dlltool.exe" "%RUNNER_TEMP%\said.txt" >nul || exit /b 1

  # The job above proves the browser needs no display. This one proves it can
  # use one: a real X server, a real window, real events, and a photograph of
  # the result taken with XGetImage.
  x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          python-version: '3.12'
          xvfb: 'true'

      # 24-bit TrueColor: what every desktop actually runs, and the format
      # the backend converts to with no per-pixel work.
      - name: X11 tests at depth 24
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            $PY tests/test_x11.py

      # 16-bit 5-6-5, which no byte layout can describe, so this is the only
      # thing that ever runs the slow per-channel path against a real server.
      - name: X11 tests at depth 16
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x16" \
            $PY tests/test_x11.py

      # x11_shot.py now checks what came back off the server -- the three
      # colour swatches, present and in order -- rather than only that the
      # file is not empty. The upload is for a human, not for the build.
      - name: Photograph a real X11 window
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            $PY tests/x11_shot.py artifacts/x11-window.png

      - name: Upload the window
        uses: actions/upload-artifact@v4
        with:
          name: x11-window
          path: artifacts/x11-window.png
          if-no-files-found: error

  # The Wayland sibling of the job above. X11 can be faked with Xvfb, but
  # Wayland has no equivalent, so the compositor is weston's headless
  # backend: a real registry, a real xdg toplevel, real shared-memory
  # buffers, and the suite reads the pixels it wrote back out of its own
  # mmap. This job is why the live half of test_wayland.py exists at all --
  # it is the only runner that ever starts it.
  wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          python-version: '3.12'

      # The client under test speaks Wayland over a bare socket, but the
      # *compositor* it talks to is weston, and weston links these itself.
      - name: Install weston (the compositor under test)
        run: |
          sudo apt-get update
          sudo apt-get install -y weston libwayland-client0 \
            libwayland-cursor0 libxkbcommon0

      - name: Wayland tests against a headless compositor
        run: |
          RUNTIME="$(mktemp -d)"
          chmod 0700 "$RUNTIME"
          XDG_RUNTIME_DIR="$RUNTIME" weston --backend=headless-backend.so \
            --socket=feetbrowser-ci --renderer=pixman \
            >"$RUNTIME/weston.log" 2>&1 &
          WESTON_PID=$!
          sleep 1
          XDG_RUNTIME_DIR="$RUNTIME" WAYLAND_DISPLAY=feetbrowser-ci \
            $PY tests/test_wayland.py
          kill $WESTON_PID || true

  # Warnings are kept at zero deliberately. Denying them here is the only
  # thing that keeps it true; 84 of them accumulated the other way. Its own
  # job because it depends on nothing Python and holds up nothing else.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-check-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-check-

      - name: Rust warnings
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --manifest-path rust/Cargo.toml --all-targets

      # `cargo check --all-targets` compiles the tests but never runs them,
      # so for a long time all of them were only ever type-checked. The 60
      # that are left take hundredths of a second; the tokenizer's own suite
      # moved out with it to `footnote`, which runs it on three platforms.
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

  # This job used to install Pillow and cairosvg so the JPEG, WebP and SVG
  # branches behind them ran at least once. There are no such branches now:
  # JPEG is decoded here and the rest draw as alt text. Every job above runs
  # without the two libraries and would keep passing if an import of one crept
  # back in, because on those runners it would fail and be swallowed by the
  # same try/except that used to be the point. So the job is inverted. It
  # installs both, making an accidental import succeed, and then insists the
  # suite runs without either module ever appearing in sys.modules. It is the
  # only place that can tell "we do not need them" from "they are not here".
  unused-image-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          python-version: '3.12'
          extras: Pillow cairosvg

      - name: Confirm both libraries are importable on this runner
        run: $PY -c "import PIL.Image, cairosvg"

      - name: Unit tests, which assert neither is reached for
        run: $PY tests/test_units.py

      - name: Renderer tests with both installed
        run: $PY tests/test_render.py

      - name: End-to-end pixels, which assert the same after a real page load
        run: $PY tests/test_e2e.py

  # The only job that leaves the machine. Its two suites run against fixtures
  # on every push, which is what catches a broken click or a broken form;
  # this runs the same code against the real web, where DNS, TLS, chunked
  # bodies and gzip are somebody else's and change without telling us.
  # Weekly and on main, because a third party's bad afternoon is not a reason
  # to fail a contributor's pull request.
  live-web:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          python-version: '3.12'

      - name: Navigation and history against the real web
        run: $PY tests/test_nav.py

      - name: Whole-pipeline smoke against the real web
        run: $PY tests/smoke.py
