name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-13, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: rustup toolchain install nightly --profile default
      # Caching was removed: it was masking clean-build regressions.
      - name: Build core
        working-directory: rust
        run: cargo build --release

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: rustup toolchain install nightly --profile default
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings feetbrowser/*.py tests/*.py
